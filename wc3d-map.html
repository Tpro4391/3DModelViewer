<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DENSO WC 3D map</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0e1420;
    font:13px/1.4 "Segoe UI",Roboto,system-ui,sans-serif;color:#e8edf6}
  /* toàn bộ trang LÀ viewport 3D */
  #viewport{position:fixed;inset:0;overflow:hidden}
  #viewport canvas{width:100%;height:100%;display:block}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}

  .ov{position:absolute;background:rgba(9,22,36,.78);border:1px solid rgba(255,255,255,.16);
    border-radius:9px;backdrop-filter:blur(6px);z-index:3}
  #legend{left:10px;top:10px;padding:7px 10px;display:none;font-size:11.5px}
  #legend.show{display:block}
  #legend .r{display:flex;align-items:center;gap:7px;margin:2px 0;white-space:nowrap}
  #legend .r i{width:22px;height:4px;border-radius:2px;display:inline-block}
  #legend .r b{margin-left:auto;font-variant-numeric:tabular-nums}
  #tools{right:10px;top:10px;padding:5px;display:flex;gap:4px;z-index:4}
  #tools button{background:transparent;border:1px solid rgba(255,255,255,.18);color:#dce9f5;
    border-radius:7px;padding:3px 7px;font:inherit;font-size:11px;cursor:pointer}
  #tools button:hover{background:rgba(47,136,224,.35)}
  #tools button.on{background:#2f88e0;border-color:#2f88e0;color:#04121c;font-weight:700}
  #hud{right:10px;bottom:10px;padding:5px 9px;display:flex;align-items:center;gap:9px}
  #sbar{height:5px;border:1px solid rgba(255,255,255,.5);border-top:0;min-width:34px;
    background:linear-gradient(90deg,rgba(255,255,255,.45) 50%,transparent 50%);background-size:16px 100%}
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:#0e1420;z-index:20;
    color:#7f93a8;letter-spacing:1px;font-size:12px}
</style>
</head>
<body>
<div id="viewport">
  <div id="labels"></div>

  <div id="legend" class="ov">
    <div class="r"><i style="background:#2f88e0"></i>Nam → <span id="lgM">—</span><b id="lgMd"></b></div>
    <div class="r"><i style="background:#e469b4"></i>Nữ → <span id="lgF">—</span><b id="lgFd"></b></div>
  </div>

  <div id="tools" class="ov">
    <button data-view="iso">3D</button>
    <button data-view="top">Trên</button>
    <button id="tFit">Fit</button>
    <button id="tMach">Máy</button>
    <button id="tName">Tên</button>
  </div>

  <div id="hud" class="ov">
    <svg viewBox="0 0 40 40" width="26" height="26">
      <circle cx="20" cy="20" r="18" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.2)"/>
      <g id="needle" style="transform-origin:20px 20px">
        <polygon points="20,4 24,21 20,18 16,21" fill="#ff6a5e"/>
        <polygon points="20,36 16,19 20,22 24,19" fill="#93a3bb"/>
      </g>
    </svg>
    <div><div id="sbar"></div>
      <div id="stxt" style="font-size:9.5px;color:#9fb6ca;text-align:center">—</div></div>
  </div>
</div>

<div id="boot">ĐANG DỰNG MÔ HÌNH 3D…</div>

/* ================================================================ routing */
const CELL_M = wm(G.cell);
const cellToWorld = (gx, gy) => [ wx(G.x0 + (gx+.5)*G.cell), wz(G.y0 + (gy+.5)*G.cell) ];
const worldToCell = (x, z) => [ Math.round((x*PPM + CX - G.x0)/G.cell - .5),
                                Math.round((z*PPM + CY - G.y0)/G.cell - .5) ];
function snap(gx, gy) {
  if (walkAt(gx, gy)) return [gx, gy];
  for (let r = 1; r < 200; r++)
    for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
      if (walkAt(gx+dx, gy+dy)) return [gx+dx, gy+dy];
    }
  return null;
}
const dist = new Int32Array(NCELL), prev = new Int32Array(NCELL), geo = new Float32Array(NCELL);
const STEP = r => r === 1 ? 10 : r === 2 ? 13 : 16;
const DOOR_PENALTY = 55;
const ORTHO = [[1,0],[-1,0],[0,1],[0,-1]];
const DIAG  = [[1,1],[1,-1],[-1,1],[-1,-1]];

function dijkstra(sx, sy) {
  dist.fill(0x7fffffff); prev.fill(-1); geo.fill(0);
  const STEP_M = CELL_M, DIAG_M = CELL_M * 1.4142;
  const buckets = []; let last = 0;
  const push = (i, d) => { (buckets[d] || (buckets[d] = [])).push(i); if (d > last) last = d; };
  const s = sy*G.w + sx; dist[s] = 0; push(s, 0);
  for (let head = 0; head <= last; head++) {
    const b = buckets[head];
    if (!b) continue;
    for (const i of b) {
      const d = dist[i]; if (d !== head) continue;
      const x = i % G.w, y = (i - x)/G.w, ra = REG[i];
      for (const nb of ORTHO) {
        const nx = x + nb[0], ny = y + nb[1];
        const rb = regAt(nx, ny); if (!rb) continue;
        const j = ny*G.w + nx;
        let c = STEP(rb);
        if (rb !== ra) {
          /* lối đi <-> sàn mở (line, sàn văn phòng): không có vách nên đi tự do */
          if (ra <= 2 && rb <= 2) { /* ok */ }
          else if (DOOR[i] && DOOR[j]) c += DOOR_PENALTY;
          else continue;
        }
        const nd = d + c;
        if (nd < dist[j]) { dist[j] = nd; prev[j] = i; geo[j] = geo[i] + STEP_M; push(j, nd); }
      }
      for (const nb of DIAG) {
        const nx = x + nb[0], ny = y + nb[1];
        if (regAt(nx, ny) !== ra) continue;
        if (regAt(nx, y) !== ra || regAt(x, ny) !== ra) continue;
        const j = ny*G.w + nx, nd = d + Math.round(STEP(ra) * 1.4142);
        if (nd < dist[j]) { dist[j] = nd; prev[j] = i; geo[j] = geo[i] + DIAG_M; push(j, nd); }
      }
    }
    buckets[head] = null;
  }
}
function los(ax, ay, bx, by) {
  const n = Math.max(Math.abs(bx-ax), Math.abs(by-ay));
  if (!n) return true;
  const r0 = regAt(ax, ay);
  for (let i = 0; i <= n; i++)
    if (regAt(Math.round(ax + (bx-ax)*i/n), Math.round(ay + (by-ay)*i/n)) !== r0) return false;
  return true;
}

const gPath = new THREE.Group(); scene.add(gPath);
let drawn = [];              // [{curve,len,t0,arrows,tube,color}]
let lastRoute = null;        // tuyến chính (tương thích API cũ)
let lastRoutes = [];         // tất cả tuyến đang vẽ
const listeners = { pick:[], route:[] };
const emit = (k, v) => listeners[k].forEach(f => { try { f(v); } catch (e) { console.error(e); } });

const ROUTE_COL = { men:0x2f88e0, women:0xe469b4, any:0x00e5ff };

function clearRoute() {
  gPath.clear(); drawn = []; lastRoute = null; lastRoutes = [];
  gYou.visible = false;
  beacons.forEach(b => { b.active = false; });

function roomAtPoint(x, z) {
  return rooms.find(r => x >= r.X && x <= r.X + r.W && z >= r.Z && z <= r.Z + r.D) || null;
}

/** Tìm tuyến ngắn nhất từ ô đã chạy dijkstra tới 1 trong các WC được phép.
 *  @param {function} allow  (toilet) => bool
 *  @returns {{t,metres,P}|null} */
function pickTarget(x, z, allow) {
  let best = null;
  toiletList.forEach(t => {
    if (allow && !allow(t)) return;
    const cc = worldToCell(t.room.cxw, t.room.czw);
    const cand = walkAt(cc[0], cc[1]) ? cc : t.cell;
    if (!cand) return;
    const i = cand[1]*G.w + cand[0], v = dist[i];
    if (v < 0x7fffffff && (!best || v < best.v)) best = { t, v, cell:cand };
  });
  if (!best) return null;

  let cells = [], i = best.cell[1]*G.w + best.cell[0];
  while (i !== -1) { cells.push([i % G.w, (i - i % G.w)/G.w]); i = prev[i]; }
  cells.reverse();
  const simp = [cells[0]];
  let k = 0;
  while (k < cells.length - 1) {
    let j = cells.length - 1;
    for (; j > k + 1; j--) if (los(cells[k][0], cells[k][1], cells[j][0], cells[j][1])) break;
    simp.push(cells[j]); k = j;
  }
  const pts = [new THREE.Vector3(x, .55, z)];
  simp.forEach(c => { const w = cellToWorld(c[0], c[1]); pts.push(new THREE.Vector3(w[0], .55, w[1])); });
  pts.push(new THREE.Vector3(best.t.room.cxw, .55, best.t.room.czw));
  const P = pts.filter((p, idx) => idx === 0 || p.distanceTo(pts[idx-1]) > .35);
  let metres = 0; for (let n = 1; n < P.length; n++) metres += P[n].distanceTo(P[n-1]);
  return { t:best.t, metres, P };
}

/** Vẽ 1 tuyến (ống + mũi tên chạy). `lift` để 2 tuyến song song không trùng nhau. */
function drawPath(P, color, lift, dashed) {
  if (P.length < 2) return null;
  const Q = P.map(p => p.clone().setY(0.55 + (lift || 0)));
  const curve = new THREE.CatmullRomCurve3(Q, false, 'catmullrom', 0.04);
  const seg = Math.max(24, Q.length*10);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, seg, 0.5, 10, false),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:.94 }));
  gPath.add(tube);
  gPath.add(new THREE.Mesh(new THREE.TubeGeometry(curve, seg, 1.2, 10, false),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:.16, depthWrite:false })));
  let len = 0; for (let i = 1; i < Q.length; i++) len += Q[i].distanceTo(Q[i-1]);
  const arrows = [];
  const am = new THREE.MeshBasicMaterial({ color:0xffffff });
  const ag = new THREE.ConeGeometry(0.85, 2.1, 14);
  const n = Math.max(3, Math.min(26, Math.round(len/7)));
  for (let a = 0; a < n; a++) { const m = new THREE.Mesh(ag, am); gPath.add(m); arrows.push(m); }
  const st = { curve, len, t0:performance.now(), arrows, tube, color, lift:lift || 0 };
  drawn.push(st);
  return st;
}

function routeInfo(x, z, r, sex) {
  return { sex: sex || 'any', code:r.t.code, id:r.t.id, name:r.t.name, vi:r.t.vi, note:r.t.note,
           metres:r.metres, seconds:r.metres / WALK_SPEED,
           from:(roomAtPoint(x, z) || {}).name || 'Lối đi', x, z };
}

/**
 * Chỉ đường tới nhà vệ sinh (1 tuyến).
 * @param {string|number|null} to  mã WC ('WC-3'), id phòng, hoặc null = gần nhất còn chỗ
 */
function routeFrom(x, z, to) {
  const c0 = worldToCell(x, z), s = snap(c0[0], c0[1]);
  if (!s) return null;
  dijkstra(s[0], s[1]);
  const forced = (to === null || to === undefined) ? null
    : (byCode[to] ? byCode[to].id : (typeof to === 'number' ? to : null));
  const allow = forced !== null ? (t => t.id === forced)
                                : (t => hasFree(t.code, 'any'));
  const r = pickTarget(x, z, allow) || pickTarget(x, z, forced !== null ? (t => t.id === forced) : null);
  if (!r) return null;

  gPath.clear(); drawn = [];
  gYou.position.set(x, 0, z); gYou.visible = true;
  beacons.forEach(b => { b.active = b.t.id === r.t.id; });
  drawPath(r.P, ROUTE_COL.any, 0);

  const out = routeInfo(x, z, r, 'any');
  lastRoute = out; lastRoutes = [out];
  if (ui) ui.onRoute(out);
  emit('route', out);
  ctrl.mark();
  return out;
}

/**
 * Chỉ đường riêng cho Nam (xanh) và Nữ (hồng): mỗi bên tới WC gần nhất **còn chỗ**;
 * nếu WC gần nhất hết chỗ thì tự chuyển sang WC gần tiếp theo.
 * @returns {{men:route|null, women:route|null}}
 */
function routeGender(x, z) {
  const c0 = worldToCell(x, z), s = snap(c0[0], c0[1]);
  if (!s) return { men:null, women:null };
  dijkstra(s[0], s[1]);

  gPath.clear(); drawn = [];
  gYou.position.set(x, 0, z); gYou.visible = true;

  const out = { men:null, women:null };
  [['men', 1.05], ['women', -0.15]].forEach(([sex, lift]) => {
    let r = pickTarget(x, z, t => hasFree(t.code, sex));
    if (!r) r = pickTarget(x, z, null);          // tất cả đều full -> vẫn chỉ WC gần nhất
    if (!r) return;
    drawPath(r.P, ROUTE_COL[sex], lift);
    out[sex] = routeInfo(x, z, r, sex);
  });
  lastRoutes = [out.men, out.women].filter(Boolean);
  lastRoute = out.men || out.women;
  beacons.forEach(b => { b.active = lastRoutes.some(r => r.id === b.t.id); });
  if (ui) ui.onRoute(lastRoute);
  emit('route', Object.assign({ gender:true }, out));
  ctrl.mark();
  return out;
}

const COV_COL = [0xff8a3d, 0x3ab7f0, 0x35d29a, 0xb07be0];
let coverage = null;
function computeCoverage() {
  const fields = toiletList.map(t => {
    const cc = worldToCell(t.room.cxw, t.room.czw);
    const s = walkAt(cc[0], cc[1]) ? cc : t.cell;

    const lw = 250*k, lh = (items.length*19 + 16)*k, lx = 18*k, ly = h - lh - 18*k;
    g.fillStyle = 'rgba(9,22,36,.74)'; rr(g, lx, ly, lw, lh, 8*k, true, true);
    g.textAlign = 'left'; g.textBaseline = 'middle';
    g.font = (12.5*k).toFixed(0) + 'px "Segoe UI",sans-serif';
    items.forEach((it, i) => {
      const y = ly + (16 + i*19)*k;
      g.fillStyle = it[0]; rr(g, lx + 12*k, y - 5*k, 11*k, 11*k, 2.5*k, true, true);
      g.fillStyle = '#e6eef7'; g.fillText(it[1], lx + 30*k, y);
    });
  }

  scene.background = new THREE.Color(BG);
  renderer.setPixelRatio(pr);
  camera.aspect = oldAspect; camera.updateProjectionMatrix();
  resize();
  return out.toDataURL('image/png');
}
function rr(g, x, y, w, h, r, top, bot) {
  g.beginPath();
  g.moveTo(x + (top ? r : 0), y);
  g.lineTo(x + w - (top ? r : 0), y);
  if (top) g.quadraticCurveTo(x + w, y, x + w, y + r); else g.lineTo(x + w, y);
  g.lineTo(x + w, y + h - (bot ? r : 0));
  if (bot) g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); else g.lineTo(x + w, y + h);
  g.lineTo(x + (bot ? r : 0), y + h);
  if (bot) g.quadraticCurveTo(x, y + h, x, y + h - r); else g.lineTo(x, y + h);
  g.lineTo(x, y + (top ? r : 0));
  if (top) g.quadraticCurveTo(x, y, x + r, y);
  g.closePath(); g.fill();
}
function download(dataUrl, name) {

/* ================================================================= loop */
let VW = 1, VH = 1;
function resize() {
  const rc = host.getBoundingClientRect();
  VW = Math.max(1, Math.round(rc.width  || innerWidth));
  VH = Math.max(1, Math.round(rc.height || innerHeight));
  renderer.setSize(VW, VH);
  camera.aspect = VW/VH; camera.updateProjectionMatrix();
  ctrl.mark();
}
addEventListener('resize', resize);
resize();
views.iso();

const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  ctrl.update();

  beacons.forEach((b, i) => {
    const boost = b.active ? 1.35 : 1;
    b.rings.forEach((r, j) => {
      const k = (t*(b.active ? 0.65 : 0.45) + j/3) % 1;
      r.scale.setScalar(2 + k * Math.max(b.t.room.W, b.t.room.D) * 0.8 * boost);
      r.material.opacity = (b.active ? 0.75 : 0.5) * (1 - k);
    });
    b.pin.position.y = b.base + Math.sin(t*1.6 + i) * 1.5;
    b.pin.rotation.y = t * 0.9;
    b.pin.scale.setScalar(b.active ? 1.45 : 1);
    b.beam.material.opacity = (b.active ? 0.34 : 0.22) + 0.05*Math.sin(t*2.2 + i);
  });
  drawn.forEach(st => {
    const period = Math.max(3, st.len/9);
    const base = ((performance.now() - st.t0)/1000/period) % 1;
    st.arrows.forEach((a, i) => {
      const u = (base + i/st.arrows.length) % 1;
      const p = st.curve.getPointAt(u), d = st.curve.getTangentAt(u);
      a.position.copy(p).setY(1.35 + st.lift);
      a.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.clone().normalize());
    });
    st.tube.material.opacity = 0.8 + 0.18*Math.sin(t*4);
  });
  if (gYou.visible) {
    const u = gYou.userData;
    u.halo.scale.setScalar(1 + 0.18*Math.sin(t*3.2));
    u.pin.position.y = YOU_H + Math.sin(t*1.7) * 1.4;
    u.pin.rotation.y = -t * 0.9;
    u.beam.material.opacity = 0.2 + 0.06*Math.sin(t*2.4);
    u.rings.forEach((r, j) => {
      const k = (t*0.55 + j/3) % 1;
      r.scale.setScalar(1.6 + k * 7);
      r.material.opacity = 0.6 * (1 - k);

const boot = document.getElementById('loading');

/* ============================================================ PUBLIC API */
const API = {
  /* --- dữ liệu ------------------------------------------------------- */
  toilets: () => toiletList.map(t => ({ id:t.id, code:t.code, name:t.name, vi:t.vi, note:t.note,
                                        x:t.room.cxw, z:t.room.czw, area:t.room.area,
                                        men:t.men, women:t.women })),
  areas:   () => rooms.map(r => ({ id:r.id, name:r.name, cat:r.cat, x:r.cxw, z:r.czw, area:r.area })),
  areaAt:  (x, z) => { const r = roomAtPoint(x, z); return r ? r.name : null; },

  /* --- dẫn đường ----------------------------------------------------- */
  /** guide({x,z} | 'WC-3' | 'AFM Sensor', to?) → {code,name,metres,seconds,…} */
  guide(from, to) {
    let x, z;
    if (from && typeof from === 'object' && 'code' in from && byCode[from.code]) {
      const t = byCode[from.code];
      x = t.room.cxw; z = t.room.czw; hereCode = t.code;
    }
    else if (from && typeof from === 'object' && 'x' in from) { x = from.x; z = from.z; }
    else {
      const t = byCode[from];
      const r = t ? t.room : rooms.find(a => a.name.toLowerCase() === String(from).toLowerCase());
      if (!r) return null;
      x = r.cxw; z = r.czw;
      if (t) hereCode = t.code;
    }
    const out = routeFrom(x, z, to === undefined ? null : to);
    renderCards();
    return out;
  },
  guideFrom: (x, z, to) => { const r = routeFrom(x, z, to === undefined ? null : to); renderCards(); return r; },
  /** 2 tuyến: Nam (xanh) + Nữ (hồng), mỗi bên tới WC gần nhất còn chỗ */
  guideGender(from) {
    let x, z;
    if (from && typeof from === 'object' && 'code' in from && byCode[from.code]) {
      const t = byCode[from.code]; x = t.room.cxw; z = t.room.czw; hereCode = t.code;
    } else if (from && typeof from === 'object' && 'x' in from) { x = from.x; z = from.z; }
    else {
      const t = byCode[from];
      const r = t ? t.room : rooms.find(a => a.name.toLowerCase() === String(from).toLowerCase());
      if (!r) return null;
      x = r.cxw; z = r.czw; if (t) hereCode = t.code;
    }
    const out = routeGender(x, z);
    renderCards();
    return out;
  },
  routes: () => lastRoutes.slice(),
  routeColors: () => ({ men:'#2f88e0', women:'#e469b4', any:'#00e5ff' }),
  guideFromArea(name) { return API.guide(name); },
  clear() { hereCode = null; clearRoute(); renderCards(); },
  route: () => lastRoute,

  /* --- "You are here" ------------------------------------------------ */
  setHere(codeOrNull) { hereCode = codeOrNull || null; renderCards(); },
  showYou(x, z) { gYou.position.set(x, 0, z); gYou.visible = true; ctrl.mark(); },

  /* --- số liệu Nam/Nữ từ ThingsBoard --------------------------------- */
  /** setOccupancy({'WC-1':{men:{free:3,total:6},women:{free:10,total:16}}, …}) */
  setOccupancy(map) {
    Object.keys(map || {}).forEach(code => {
      if (!occupancy[code]) occupancy[code] = {};

    });

    paintBeacons();

  occupancy: () => JSON.parse(JSON.stringify(occupancy)),
  hasFree: (code, sex) => hasFree(code, sex || 'any'),
  wcState: code => freeState(code),

  /* --- vùng phục vụ -------------------------------------------------- */
  coverage() {

      return { area:r.name, cat:r.cat, toilet: e ? toiletList[e.k].name : null,
               code: e ? toiletList[e.k].code : null,
               metres: e ? +e.metres.toFixed(1) : null };

  },
  showCoverage(on) { const c = document.getElementById('cCov'); if (c) c.checked = !!on; setCoverage(!!on); },

  /* --- camera / hiển thị --------------------------------------------- */
  view: v => views[v] && views[v](),
  focus: focusOn,
  focusPoint(x, z, d, theta, phi, y) {
    ctrl.goto(new THREE.Vector3(x, y || 0, z), d || 80,
              theta === undefined ? null : theta, phi === undefined ? 0.55 : phi);
  },
  fit: (panel) => fitView(ctrl.theta, ctrl.phi, 1.1, panel),
  layers(o) {
    o = o || {};
    if ('walls'    in o) gWall.visible = !!o.walls;
    if ('props'    in o) gProp.visible = !!o.props;
    if ('machines' in o) gMachines.visible = !!o.machines;
    if ('aisle'    in o) gAisle.visible = !!o.aisle;
    if ('shell'    in o) gEnv.visible = !!o.shell;
    if ('context'  in o) gCtx.visible = !!o.context;
    if ('labels'   in o) { showAllLabels = !!o.labels;
      labels.forEach(l => { if (l.cls.indexOf('room') >= 0) l.el.style.display = o.labels ? '' : 'none'; }); }
    if ('cards'    in o) wcCards.forEach(c => c.el.style.display = o.cards ? '' : 'none');
    ctrl.mark();
  },

  /* --- ảnh PNG ------------------------------------------------------- */
  snapshot,
  savePng(name, w, h, opt) { download(snapshot(w, h, opt || { areaLabels:true }), name); },

  /* --- sự kiện ------------------------------------------------------- */
  on(evt, cb) { if (listeners[evt]) listeners[evt].push(cb); return API; },

  /* --- tiện ích ------------------------------------------------------ */
  pxToWorld: (px, py) => [wx(px), wz(py)],
  worldToPx: (x, z) => [x*PPM + CX, z*PPM + CY],
  scale: { pixelsPerMetre:PPM, originPx:[CX, CY] },
  resize

window.WC3D = API;
window.FactoryView = API;      // tên cũ, giữ để không phá code đã dùng

/* nhận lệnh từ ThingsBoard qua postMessage khi nhúng bằng <iframe> */
addEventListener('message', ev => {
  const d = ev.data;
  if (!d || typeof d !== 'object' || !d.wc3d) return;
  const fn = API[d.wc3d];
  if (typeof fn !== 'function') return;
  const res = fn.apply(API, d.args || []);
  if (d.reply && ev.source) ev.source.postMessage({ wc3dReply:d.reply, result:res }, '*');

})();

<script>/* ==== map.js ==== */
/* =============================================================================
   DENSO — wc3d-map: CHỈ có khung 3D, dùng để nhúng vào 1 widget 3D.

   ---------------------------------------------------------------------------
   CÁCH GỬI DỮ LIỆU VÀO (chọn 1 trong 3):

   1) postMessage  (khi nhúng bằng <iframe>)
        iframe.contentWindow.postMessage({ wcmap:'update', args:[{
          wcs: { 'wc-01': {now_nam:2, total_nam:6, now_nu:5, total_nu:8}, … },
          x_pos: 1830, y_pos: 1100        // toạ độ trên map
        }]}, '*');
      Iframe gửi { wcmapReady:true } khi sẵn sàng.

   2) Cùng trang / cùng origin:  iframe.contentWindow.WCMAP.update({…})
      hoặc trực tiếp  WCMAP.update({…})

   3) Query string khi mở:
        map.html?x=1830&y=1100                    (toạ độ pixel trên anh-map-v2.png)
        map.html?space=m&x=12.5&y=-30.2           (toạ độ mét)
        map.html?at=WC-3
        map.html?wcs=wc-01:2/6/5/8,wc-02:6/6/8/8  (now_nam/total_nam/now_nu/total_nu)
        &hud=0&legend=0&machines=1&names=1&space=px

   Luật điều hướng: mỗi giới đi tới nhà vệ sinh **gần nhất còn chỗ**; nếu WC gần
   nhất hết chỗ thì tự chuyển sang WC gần tiếp theo. Tuyến Nam = xanh, Nữ = hồng.
   Biển WC: xanh = còn chỗ, đỏ = hết chỗ.
   ========================================================================== */
(function () {
'use strict';

const $ = id => document.getElementById(id);
const V = window.WC3D;
const TOILETS = V.toilets();
const BY = {}; TOILETS.forEach(t => BY[t.code] = t);

const cfg = {
  space: 'px',        // 'px' = pixel ảnh gốc | 'm' = mét
  autoFrame: true,    // tự chỉnh camera theo tuyến đường
  legend: true,
  machines: false,
  names: false
};
const S = { pos: null, wcs: {}, routes: null };

/** 'wc-01' | 'WC1' | 'wc_5' | 1 | '1'  ->  'WC-1' */
function normCode(v) {
  const m = /(\d+)/.exec(String(v));
  return m ? 'WC-' + parseInt(m[1], 10) : String(v).toUpperCase();
}

/** {now_nam,total_nam,now_nu,total_nu} -> {men:{free,total},women:{free,total}} */
function toOcc(v) {
  const num = x => (x === null || x === undefined || x === '') ? null : (+x || 0);
  const mt = num(v.total_nam !== undefined ? v.total_nam : v.men_total);
  const mn = num(v.now_nam   !== undefined ? v.now_nam   : v.men_now);
  const ft = num(v.total_nu  !== undefined ? v.total_nu  : v.women_total);
  const fn = num(v.now_nu    !== undefined ? v.now_nu    : v.women_now);
  const o = {};
  if (mt !== null) o.men   = { total: mt, free: Math.max(0, mt - (mn || 0)) };
  if (ft !== null) o.women = { total: ft, free: Math.max(0, ft - (fn || 0)) };
  return o;
}

function renderLegend() {
  const box = $('legend');
  if (!cfg.legend || !S.routes) { box.classList.remove('show'); return; }
  const set = (a, b, r) => {
    $(a).textContent = r ? (BY[r.code] ? BY[r.code].vi : r.name) : 'không có';
    $(b).textContent = r ? r.metres.toFixed(0) + ' m · ' + Math.round(r.seconds) + ' s' : '';
  };
  set('lgM', 'lgMd', S.routes.men);
  set('lgF', 'lgFd', S.routes.women);
  box.classList.add('show');
}

function toWorld(x, y, space) {
  space = space || cfg.space;
  if (space === 'm' || space === 'metre' || space === 'meter') return { x: +x, z: +y };
  const p = V.pxToWorld(+x, +y);
  return { x: p[0], z: p[1] };
}

function redraw() {
  if (!S.pos) { V.clear(); S.routes = null; renderLegend(); return; }
  S.routes = V.guideGender(S.pos);
  renderLegend();
  if (cfg.autoFrame) frame();
}

/** camera bao trọn điểm đứng + các WC đích */
function frame() {
  const pts = [S.pos];
  [S.routes && S.routes.men, S.routes && S.routes.women].forEach(r => {
    if (r && BY[r.code]) pts.push(BY[r.code]);
  });
  let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
  pts.forEach(p => { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x);
                     z0 = Math.min(z0, p.z); z1 = Math.max(z1, p.z); });
  const d = Math.min(360, Math.max(150, Math.hypot(x1-x0, z1-z0) * 2.1));
  V.focusPoint((x0+x1)/2, (z0+z1)/2, d, undefined, 0.52, 16);
}

/* ============================================================ public API */
const MAP = {
  /** gọi 1 lần với đủ dữ liệu — dùng cho ThingsBoard onDataUpdated */
  update(d) {
    d = d || {};
    if (d.wcs) MAP.setWcs(d.wcs);
    const hx = d.x_pos !== undefined ? d.x_pos : d.x;
    const hy = d.y_pos !== undefined ? d.y_pos : d.y;
    if (hx !== undefined && hx !== null && hx !== '' &&
        hy !== undefined && hy !== null && hy !== '') MAP.setPosition(hx, hy, d.space);
    else if (d.at) MAP.setAt(d.at);
    return MAP.state();
  },

  /** {'wc-01':{now_nam,total_nam,now_nu,total_nu}, …}  (chấp nhận mọi cách viết mã WC) */
  setWcs(map) {
    const occ = {};
    Object.keys(map || {}).forEach(k => {
      const code = normCode(k);
      S.wcs[code] = map[k];
      const o = toOcc(map[k] || {});
      if (Object.keys(o).length) occ[code] = o;
    });
    if (Object.keys(occ).length) V.setOccupancy(occ);
    if (S.pos) redraw();
    return occ;
  },

  /** vị trí cần chỉ hướng — mặc định là toạ độ pixel trên anh-map-v2.png */
  setPosition(x, y, space) {
    S.pos = toWorld(x, y, space);
    V.setHere(null);
    redraw();
    return S.routes;
  },
  /** 'WC-3' | tên khu vực */
  setAt(v) {
    const t = BY[normCode(v)] || BY[v];
    if (t) { S.pos = { x:t.x, z:t.z }; V.setHere(t.code); }
    else {
      const a = V.areas().find(a => a.name.toLowerCase() === String(v).toLowerCase());
      if (!a) return null;
      S.pos = { x:a.x, z:a.z }; V.setHere(null);
    }
    redraw();
    return S.routes;
  },
  clear() { S.pos = null; V.clear(); S.routes = null; renderLegend(); },

  config(o) {
    Object.assign(cfg, o || {});
    V.layers({ machines:cfg.machines, labels:cfg.names });
    $('tMach').classList.toggle('on', cfg.machines);
    $('tName').classList.toggle('on', cfg.names);
    if (o && 'hud' in o) $('hud').style.display = o.hud ? '' : 'none';
    if (o && 'tools' in o) $('tools').style.display = o.tools ? '' : 'none';
    renderLegend();
    return Object.assign({}, cfg);
  },
  view: v => V.view(v),
  focus: (n, d) => V.focus(n, d),
  toilets: () => TOILETS,
  routes: () => S.routes,
  state: () => JSON.parse(JSON.stringify({ pos:S.pos, wcs:S.wcs, cfg,
    routes: S.routes ? { men:S.routes.men, women:S.routes.women } : null })),
  snapshot: (w, h, o) => V.snapshot(w, h, o),
  savePng: (n, w, h, o) => V.savePng(n, w, h, o),
  view3d: V
};
window.WCMAP = MAP;

/* ------------------------------------------------------------- tương tác */
document.querySelectorAll('#tools [data-view]').forEach(b =>
  b.onclick = () => V.view(b.dataset.view));
$('tFit').onclick  = () => (S.pos && cfg.autoFrame ? frame() : V.view('iso'));
$('tMach').onclick = () => MAP.config({ machines: !cfg.machines });
$('tName').onclick = () => MAP.config({ names: !cfg.names });

/* click vào sàn = đặt vị trí; click vào WC = coi như đang đứng ở WC đó */
V.on('pick', p => {
  if (p.toilet) { MAP.setAt(p.toilet); return; }
  S.pos = { x:p.x, z:p.z }; V.setHere(null); redraw();
});

/* ================================================================== boot */
const q = new URLSearchParams(location.search);
if (q.get('space')) cfg.space = q.get('space');
cfg.legend   = q.get('legend')   !== '0';
cfg.machines = q.get('machines') === '1';
cfg.names    = q.get('names')    === '1';
cfg.autoFrame = q.get('autoframe') !== '0';
MAP.config({});
if (q.get('hud')   === '0') $('hud').style.display = 'none';
if (q.get('tools') === '0') $('tools').style.display = 'none';

if (q.get('wcs')) {                     // wc-01:2/6/5/8,wc-02:6/6/8/8
  const m = {};
  q.get('wcs').split(',').forEach(part => {
    const kv = part.split(':');
    if (kv.length < 2) return;
    const v = kv[1].split('/').map(Number);
    m[kv[0]] = { now_nam:v[0], total_nam:v[1], now_nu:v[2], total_nu:v[3] };
  });
  MAP.setWcs(m);
}
if (q.get('at')) MAP.setAt(q.get('at'));
else if (q.get('x') !== null && q.get('y') !== null) MAP.setPosition(q.get('x'), q.get('y'));
else V.view('iso');

addEventListener('resize', () => setTimeout(V.resize, 60));
const boot = $('boot'); if (boot) boot.remove();

/* ------------------------------------------------------- postMessage API */
addEventListener('message', ev => {
  const d = ev.data;
  if (!d || typeof d !== 'object' || !d.wcmap) return;
  const fn = MAP[d.wcmap];
  if (typeof fn !== 'function') return;
  const res = fn.apply(MAP, d.args || []);
  if (d.reply && ev.source) ev.source.postMessage({ wcmapReply:d.reply, result:res }, '*');
});
if (parent !== window) parent.postMessage({ wcmapReady:true }, '*');

})();

</script>
</body>
</html>
